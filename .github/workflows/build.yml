name: Build

on:
  push:
    branches: [main]
  pull_request:

env:
  # The Filen SDK revision the app is built and tested against (bump deliberately).
  FILEN_RS_COMMIT: 9611ef8bfd988b278c21df56fb2cf56edfc6b01a

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
      - name: Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Get the Filen SDK
        run: |
          git clone https://github.com/FilenCloudDienste/filen-rs external/filen-rs
          git -C external/filen-rs checkout "$FILEN_RS_COMMIT"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            external/filen-rs/target
          key: rust-${{ env.FILEN_RS_COMMIT }}-${{ hashFiles('build-rust.sh') }}

      - name: Rust toolchain (version pinned by the SDK) and cargo-ndk
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          cd external/filen-rs
          rustup toolchain install   # reads rust-toolchain.toml
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Build the Rust SDK and generate the Kotlin bindings
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: ./build-rust.sh arm64-v8a

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
